# This is wide open only use this for testing on localhost
auth "open" {
    hosts: "*"
    default: "<user>"
}

access "open" {
    users: "*"
    newsgroups: "*"
    # Read, Post, Newnews and Ihave. Setting access replaces INN's defaults,
    # so R, P and N must be listed too.
    access: "RPNI"
}
